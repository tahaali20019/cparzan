<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سی پی ارزان - فروشگاه کالاف دیوتی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">🔥 سی پی ارزان</div>
        <nav>
            <a href="#">صفحه اصلی</a>
            <a href="#">خرید سی پی</a>
            <a href="#">پشتیبانی</a>
        </nav>
        <div class="cart-btn">🛒 سبد خرید (۰)</div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>خرید ارزان و سریع سی پی کالاف دیوتی</h1>
            <p>تحویل آنی، کاملاً امن و مطمئن برای تمام پلتفرم‌ها</p>
        </div>
    </section>

    <!-- بخش کارت محصول و فرم اطلاعات اکانت -->
    <section style="padding: 20px; text-align: center;">
        <div class="product-card" style="background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 20px; width: 300px; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.3); text-align: right;">
            
            <!-- عکس محصول -->
            <img src="cp100.jpg" alt="بسته ۱۰۰ سی‌پی" style="width: 100%; height: 150px; object-fit: contain; margin-bottom: 15px; border-radius: 5px;">
            
            <h3 style="color: #ff9800; font-size: 18px; margin-top: 0; text-align: center;">بسته ۱۰۰ سی‌پی کالاف دیوتی</h3>
            <div class="price" style="color: #ff9800; font-size: 20px; font-weight: bold; margin-bottom: 15px; text-align: center;">۶۵,۰۰۰ تومان</div>
            
            <!-- فرم دریافت اطلاعات اکانت -->
            <div style="margin-bottom: 12px;">
                <label style="display: block; font-size: 12px; margin-bottom: 4px; color: #ddd;">ایمیل اکانت:</label>
                <input type="email" placeholder="example@gmail.com" style="width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 13px; box-sizing: border-box; outline: none;">
            </div>

            <div style="margin-bottom: 12px;">
                <label style="display: block; font-size: 12px; margin-bottom: 4px; color: #ddd;">رمز عبور اکانت:</label>
                <input type="password" placeholder="رمز عبور" style="width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 13px; box-sizing: border-box; outline: none;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 12px; margin-bottom: 4px; color: #ddd;">اسم در بازی (NickName):</label>
                <input type="text" placeholder="اسم داخل بازی" style="width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 13px; box-sizing: border-box; outline: none;">
            </div>

            <!-- دکمه اتصال به درگاه پرداخت (به جای لینک_درگاه، لینک پرداخت خودت را بگذار) -->
            <a href="لینک_درگاه_پرداخت_شما_اینجا" target="_blank" style="background: #ff9800; color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; display: block; text-align: center; text-decoration: none; box-sizing: border-box; font-size: 15px;">ورود به درگاه پرداخت</a>
            
        </div>
    </section>

</body>
</html>
